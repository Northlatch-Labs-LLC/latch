name: CI

# Blocking gate ladder (SYNAPSE-HANDOUT §4.4 / DevOps standard). The repo is a
# pnpm workspace (pnpm-workspace.yaml, packageManager pin), so every step runs
# under that exact pnpm via corepack — an npm install produces a node_modules
# layout the pnpm-filtered build scripts cannot execute against.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI (brand-lint, audit, product tests, server/account/billing tests, build, typecheck, lint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable the pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Brand lint
        run: node scripts/brand-lint.mjs

      # Honest gate: if the fresh audit reports criticals, this job is red.
      - name: Dependency audit (production, critical only)
        run: pnpm audit --prod --audit-level=critical

      - name: Product tests
        run: pnpm run test:product

      # Server + account + billing regression gate: latchBilling routes (Stripe
      # mocked), the gateway account client, and the quota error classifier.
      - name: Server, account, and billing tests
        run: pnpm run test:server

      # The repo's tsc -b resolves @zcode/* subpaths through built dist output,
      # so the workspace packages must be built before typecheck can see them.
      - name: Build workspace packages
        run: pnpm run build:bootstrap

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint
